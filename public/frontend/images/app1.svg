<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="558" height="1246" viewBox="0 0 558 1246" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Clean flat wallpaper gradient -->
    <linearGradient id="wallpaper2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1730"/>
      <stop offset="45%" stop-color="#3a2a55"/>
      <stop offset="100%" stop-color="#151225"/>
    </linearGradient>

    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c94a" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#f0c94a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f0c94a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mainIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26221f"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="cardTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glowShadow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#f0c94a" flood-opacity="0.55"/>
    </filter>

    <clipPath id="frame"><rect width="558" height="1246"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ===== WALLPAPER ===== -->
    <rect width="558" height="1246" fill="url(#wallpaper2)"/>
    <circle cx="470" cy="120" r="220" fill="#5a3f86" opacity="0.35"/>
    <circle cx="60" cy="1150" r="260" fill="#2f5f7a" opacity="0.3"/>
    <ellipse cx="279" cy="430" rx="300" ry="300" fill="url(#spotlight)"/>

    <!-- ===== STATUS BAR ===== -->
    <text x="24" y="46" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">9:41</text>
    <g fill="#ffffff">
      <rect x="470" y="32" width="18" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="472" y="34" width="12" height="6" rx="1" fill="#ffffff"/>
      <circle cx="500" cy="37" r="4" fill="#ffffff"/>
      <circle cx="512" cy="37" r="4" fill="#ffffff"/>
      <circle cx="524" cy="37" r="4" fill="#ffffff"/>
    </g>

    <!-- ===== FLAT GRID OF BACKGROUND APPS (SHARP BUT DIMMED) ===== -->
    <g opacity="0.45">
      <!-- row 1 -->
      <g transform="translate(46,140)">
        <rect width="76" height="76" rx="18" fill="#3b7ddd"/>
        <circle cx="38" cy="30" r="12" fill="#ffffff"/>
        <rect x="18" y="46" width="40" height="16" rx="8" fill="#ffffff"/>
      </g>
      <g transform="translate(148,140)">
        <rect width="76" height="76" rx="18" fill="#e0574f"/>
        <path d="M38 18 L58 58 L18 58 Z" fill="#ffffff"/>
      </g>
      <g transform="translate(334,140)">
        <rect width="76" height="76" rx="18" fill="#22b07d"/>
        <rect x="18" y="18" width="40" height="40" rx="9" fill="#ffffff"/>
      </g>
      <g transform="translate(436,140)">
        <rect width="76" height="76" rx="18" fill="#f2a33c"/>
        <circle cx="38" cy="38" r="18" fill="#ffffff"/>
      </g>

      <!-- bottom row -->
      <g transform="translate(46,760)">
        <rect width="76" height="76" rx="18" fill="#9a5fd0"/>
        <rect x="16" y="30" width="44" height="10" rx="5" fill="#ffffff"/>
        <rect x="16" y="46" width="30" height="10" rx="5" fill="#ffffff"/>
      </g>
      <g transform="translate(148,760)">
        <rect width="76" height="76" rx="18" fill="#2c98c9"/>
        <path d="M20 55 L38 20 L56 55 Z" fill="#ffffff"/>
      </g>
      <g transform="translate(334,760)">
        <rect width="76" height="76" rx="18" fill="#d64d8c"/>
        <circle cx="30" cy="38" r="12" fill="#ffffff"/>
        <circle cx="50" cy="38" r="12" fill="#ffffff" opacity="0.7"/>
      </g>
      <g transform="translate(436,760)">
        <rect width="76" height="76" rx="18" fill="#4dae52"/>
        <rect x="18" y="18" width="40" height="40" rx="20" fill="#ffffff"/>
      </g>
    </g>

    <!-- Labels for dimmed apps -->
    <g opacity="0.4" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
      <text x="84" y="232">Weather</text>
      <text x="186" y="232">Camera</text>
      <text x="372" y="232">Notes</text>
      <text x="474" y="232">Store</text>
      <text x="84" y="852">Music</text>
      <text x="186" y="852">Gallery</text>
      <text x="372" y="852">Social</text>
      <text x="474" y="852">Health</text>
    </g>

    <!-- ===== ATTENTION CALLOUT BUBBLE ===== -->
    <g transform="translate(365,300)">
      <path d="M0 20 Q0 0 20 0 L118 0 Q138 0 138 20 L138 46 Q138 66 118 66 L34 66 L14 84 L18 66 L20 66 Q0 66 0 46 Z"
            fill="#ffffff"/>
      <text x="69" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Tap to open</text>
      <text x="69" y="47" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0a83e">LawCription →</text>
    </g>

    <!-- ===== MAIN APP ICON — SHARP + GLOWING ===== -->
    <circle cx="279" cy="435" r="150" fill="none" stroke="#f0c94a" stroke-width="1.5" opacity="0.4"/>
    <circle cx="279" cy="435" r="168" fill="none" stroke="#f0c94a" stroke-width="1" opacity="0.22"/>

    <g filter="url(#glowShadow)">
      <rect x="184" y="340" width="190" height="190" rx="44" fill="url(#mainIconGrad)" stroke="#f0c94a" stroke-width="2.5"/>
    </g>
    <text x="279" y="422" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="32" fill="#f4d24e">Law</text>
    <text x="279" y="458" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="32" fill="#f4d24e">Cription</text>

    <!-- new badge ribbon -->
    <g transform="translate(340,330)">
      <circle r="26" fill="#e0574f" filter="url(#softShadow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">NEW</text>
    </g>

    <text x="279" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">LawCription</text>
    <text x="279" y="584" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f0c94a" opacity="0.9">Your account is ready 🎉</text>

    <!-- ===== PAGE DOTS ===== -->
    <g fill="#ffffff" opacity="0.55">
      <circle cx="224" cy="1069" r="4"/>
      <circle cx="246" cy="1069" r="4"/>
      <circle cx="268" cy="1069" r="4"/>
      <circle cx="290" cy="1069" r="4"/>
      <circle cx="312" cy="1069" r="4"/>
      <circle cx="334" cy="1069" r="5" fill="#f0c94a" opacity="1"/>
    </g>

    <!-- ===== DOCK ===== -->
    <rect x="30" y="1115" width="498" height="92" rx="28" fill="url(#cardTint)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <g opacity="0.55">
      <g transform="translate(72,1136)"><rect width="52" height="52" rx="14" fill="#25D366"/></g>
      <g transform="translate(186,1136)"><rect width="52" height="52" rx="14" fill="#3b7ddd"/></g>
      <g transform="translate(300,1136)"><rect width="52" height="52" rx="14" fill="#e0574f"/></g>
      <g transform="translate(414,1136)"><rect width="52" height="52" rx="14" fill="#f2a33c"/></g>
    </g>

    <!-- ===== NAV BAR ===== -->
    <g fill="#ffffff" opacity="0.6">
      <rect x="128" y="1230" width="26" height="26" rx="6"/>
      <circle cx="279" cy="1243" r="15"/>
      <path d="M415 1228 L440 1243 L415 1258 Z"/>
    </g>
  </g>
</svg>
