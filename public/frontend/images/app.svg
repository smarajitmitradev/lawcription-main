<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="558" height="1246" viewBox="0 0 558 1246" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Warm abstract wallpaper gradient -->
    <linearGradient id="wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9e2df"/>
      <stop offset="35%" stop-color="#f0c98a"/>
      <stop offset="60%" stop-color="#e08a5b"/>
      <stop offset="85%" stop-color="#b79ec9"/>
      <stop offset="100%" stop-color="#9fb0c9"/>
    </linearGradient>

    <radialGradient id="glow-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe6b0" stop-opacity="0"/>
    </radialGradient>

    <!-- Focus glow ring behind main icon -->
    <radialGradient id="focus-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c94a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f0c94a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f0c94a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="app-icon-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Blur filter for background clutter apps -->
    <filter id="blurBg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="dockBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <!-- Drop shadow for main icon -->
    <filter id="mainShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="phoneClip">
      <rect x="0" y="0" width="558" height="1246" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#phoneClip)">

    <!-- ===================== WALLPAPER ===================== -->
    <rect width="558" height="1246" fill="url(#wallpaper)"/>
    <ellipse cx="420" cy="520" rx="260" ry="300" fill="url(#glow-warm)"/>
    <path d="M60 90 C 220 260, 260 420, 200 620 C 150 780, 40 900, -40 1000 L -40 -40 L 560 -40 L 560 300 C 460 200, 320 140, 60 90 Z"
          fill="#ffffff" opacity="0.35" filter="url(#blurSoft)"/>
    <path d="M180 610 C 260 560, 360 430, 400 260 C 430 140, 470 60, 560 30 L 560 1300 L 60 1300 C 40 1050, 80 780, 180 610 Z"
          fill="#e0824f" opacity="0.55" filter="url(#blurSoft)"/>
    <ellipse cx="120" cy="1080" rx="260" ry="180" fill="#8f8fc9" opacity="0.35" filter="url(#blurBg)"/>

    <!-- ===================== STATUS BAR ===================== -->
    <text x="24" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">12:09</text>
    <g transform="translate(88,26)" fill="#1a1a1a">
      <circle cx="10" cy="10" r="10" fill="#25D366"/>
      <path d="M5 10a5 5 0 1 1 8.5 3.5L15 16l-2.7-1.4A5 5 0 0 1 5 10z" fill="#ffffff" transform="scale(0.55) translate(4,3)"/>
    </g>
    <text x="500" y="44" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" opacity="0.85">4G  88%</text>

    <!-- ===================== BLURRED BACKGROUND APP CLUTTER ===================== -->
    <!-- Row 1 -->
    <g filter="url(#blurBg)" opacity="0.55">
      <g transform="translate(50,150)">
        <rect width="82" height="82" rx="20" fill="#3b7ddd"/>
        <circle cx="41" cy="41" r="22" fill="#ffffff" opacity="0.85"/>
      </g>
      <g transform="translate(430,150)">
        <rect width="82" height="82" rx="20" fill="#e04b4b"/>
        <path d="M12 60 L41 18 L70 60 Z" fill="#ffffff" opacity="0.85"/>
      </g>
      <g transform="translate(50,760)">
        <rect width="82" height="82" rx="20" fill="#22b07d"/>
        <rect x="20" y="20" width="42" height="42" rx="8" fill="#ffffff" opacity="0.85"/>
      </g>
      <g transform="translate(430,760)">
        <rect width="82" height="82" rx="20" fill="#9a5fd0"/>
        <circle cx="41" cy="30" r="14" fill="#ffffff" opacity="0.85"/>
        <rect x="18" y="48" width="46" height="18" rx="9" fill="#ffffff" opacity="0.85"/>
      </g>
      <g transform="translate(60,900)">
        <rect width="72" height="72" rx="18" fill="#f2a33c"/>
        <circle cx="36" cy="36" r="20" fill="#ffffff" opacity="0.8"/>
      </g>
      <g transform="translate(440,900)">
        <rect width="72" height="72" rx="18" fill="#2c98c9"/>
        <path d="M14 50 L36 14 L58 50 Z" fill="#ffffff" opacity="0.8"/>
      </g>
    </g>

    <!-- Faint labels under blurred icons -->
    <g filter="url(#blurBg)" opacity="0.5" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="15">
      <text x="91" y="252">Weather</text>
      <text x="452" y="252">Camera</text>
      <text x="70" y="862">Notes</text>
      <text x="440" y="862">Photos</text>
      <text x="60" y="990">Store</text>
      <text x="440" y="990">Music</text>
    </g>

    <!-- ===================== MAIN APP — LAWCRIPTION (SHARP FOCUS) ===================== -->
    <ellipse cx="279" cy="425" rx="180" ry="180" fill="url(#focus-glow)"/>

    <g filter="url(#mainShadow)">
      <rect x="179" y="335" width="200" height="200" rx="46" fill="url(#app-icon-black)" stroke="#f0c94a" stroke-width="2" stroke-opacity="0.6"/>
      <text x="279" y="418" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="34" fill="#f0e04a">Law</text>
      <text x="279" y="454" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="34" fill="#f0e04a">Cription</text>
    </g>

    <text x="279" y="568" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#1a1a1a">LawCription</text>

    <!-- subtle attention ring pulses -->
    <circle cx="279" cy="435" r="128" fill="none" stroke="#f0c94a" stroke-width="1.5" opacity="0.35"/>
    <circle cx="279" cy="435" r="150" fill="none" stroke="#f0c94a" stroke-width="1" opacity="0.2"/>

    <!-- ===================== PAGE DOTS ===================== -->
    <g fill="#333333" opacity="0.6">
      <circle cx="224" cy="1069" r="4"/>
      <circle cx="246" cy="1069" r="4"/>
      <circle cx="268" cy="1069" r="4"/>
      <circle cx="290" cy="1069" r="4"/>
      <circle cx="312" cy="1069" r="4"/>
      <circle cx="334" cy="1069" r="5" fill="#1a1a1a" opacity="1"/>
    </g>

    <!-- ===================== BLURRED DOCK ===================== -->
    <rect x="30" y="1120" width="498" height="86" rx="28" fill="#ffffff" opacity="0.18" filter="url(#dockBlur)"/>
    <g filter="url(#blurBg)" opacity="0.6">
      <g transform="translate(70,1135)"><rect width="60" height="60" rx="16" fill="#25D366"/></g>
      <g transform="translate(180,1135)"><rect width="60" height="60" rx="16" fill="#3b7ddd"/></g>
      <g transform="translate(290,1135)"><rect width="60" height="60" rx="16" fill="#e04b4b"/></g>
      <g transform="translate(400,1135)"><rect width="60" height="60" rx="16" fill="#f2a33c"/></g>
    </g>

    <!-- ===================== NAV BAR ===================== -->
    <g fill="#3a3a3a" opacity="0.6">
      <rect x="128" y="1230" width="26" height="26" rx="6"/>
      <circle cx="279" cy="1243" r="15"/>
      <path d="M415 1228 L440 1243 L415 1258 Z"/>
    </g>
  </g>
</svg>
